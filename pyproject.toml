[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "logdigest"
version = "0.1.0"
description = "Task-aware pre-digestion for RAG and LLM pipelines"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [
    {name = "Aaron Smith"},
]
dependencies = []

[project.urls]
Repository = "https://github.com/atyronesmith/denoise"

[project.optional-dependencies]
rag = ["numpy"]
benchmarks = ["numpy"]
dev = ["pytest", "jsonschema"]
discover = ["drain3>=0.9.11", "click>=8.1"]
mcp = [
    "fastmcp>=3.2.3",
]

[project.scripts]
logdigest = "logdigest.cli:cli"
logdigest-mcp = "logdigest.mcp:main"

[tool.hatch.build.targets.wheel]
packages = ["src/logdigest"]
